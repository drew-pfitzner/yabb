# YNABB on the A6. Two containers:
#   tailscale: joins the tailnet as "ynabb" and publishes https://ynabb.<tailnet>.ts.net to the internet (Funnel)
#   ynabb:      the app, sharing the tailscale container's network, so nothing is open on the home network
# Secrets go in .env next to this file (see deploy/README.md). Start: docker compose up -d --build
name: ynabb

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: ynabb-tailscale
    hostname: ynabb
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ynabb
      # the tag keeps the app's first name (YABB); the tailnet policy is written for it
      TS_EXTRA_ARGS: --advertise-tags=tag:yabb
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/serve.json:/config/serve.json:ro
    restart: unless-stopped

  ynabb:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ynabb:latest
    container_name: ynabb-app
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      BACKUP_KEY: ${BACKUP_KEY:-}
      BACKUP_DIR: /backups
      OFFSITE_DIR: /offsite
    volumes:
      - ynabb-data:/data
      # nightly encrypted backups: on the A6, and copied into iCloud Drive (paths set in .env)
      - ${YNABB_BACKUP_PATH:-./backups}:/backups
      - ${YNABB_OFFSITE_PATH:-./offsite}:/offsite
    restart: unless-stopped

volumes:
  tailscale-state:
  ynabb-data:
