<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · YNABB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 50 L50 4 A46 46 0 0 1 73 89.84 Z' fill='%232A7F98'/%3E%3Cpath d='M50 50 L73 89.84 A46 46 0 0 1 4.69 57.99 Z' fill='%2378AFC0'/%3E%3Cpath d='M50 50 L4.69 57.99 A46 46 0 0 1 50 4 Z' fill='%23EA9805'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Schibsted+Grotesk:wght@400;600&display=swap">
<link rel="stylesheet" href="server.css">
</head>
<body>
<main class="narrow">
  <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 50 L50 4 A46 46 0 0 1 73 89.84 Z" fill="var(--accent)"/><path d="M50 50 L73 89.84 A46 46 0 0 1 4.69 57.99 Z" fill="var(--accent)" fill-opacity=".62"/><path d="M50 50 L4.69 57.99 A46 46 0 0 1 50 4 Z" fill="var(--need)"/><path d="M50 50 L50 4 M50 50 L73 89.84 M50 50 L4.69 57.99" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"/></svg>YNABB</div>
  <form class="card" id="login">
    <h1>Sign in</h1>
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="row"><button class="btn primary" type="submit">Sign in</button></div>
    <div class="msg bad" id="msg" role="alert" hidden></div>
  </form>
  <p class="fine" style="margin-top:14px">Forgotten your password? Ask Drew to reset it.</p>
</main>
<script src="login.js"></script>
</body>
</html>
